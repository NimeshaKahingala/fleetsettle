    <g clip-path="url(#circ)"><rect width="512" height="512" fill="#0F2E63"/><g color="#FBFBF8" transform="translate(76,175) scale(1.8)"><use href="#c"/></g></g>
    <circle cx="256" cy="256" r="205" fill="none" stroke="#D03B3B" stroke-width="2" stroke-dasharray="8 8"/>
  </g>
  <!-- favicons -->
  <g transform="translate(24,262)">
    <g transform="scale(0.0625)"><rect width="512" height="512" rx="96" fill="#0F2E63"/><g color="#FBFBF8" transform="translate(36,146) scale(2.2)"><use href="#k"/></g></g>
    <g transform="translate(46,8) scale(0.03125)"><rect width="512" height="512" rx="96" fill="#0F2E63"/><g color="#FBFBF8" transform="translate(36,146) scale(2.2)"><use href="#k"/></g></g>
  </g>
  <!-- app bar -->
  <g transform="translate(220,258)">
    <rect width="420" height="56" rx="10" fill="#FBFBF8" stroke="#DCDBD3"/>
    <g color="#0F2E63" transform="translate(16,14) scale(0.32)"><use href="#c"/></g>
    <text x="86" y="35" font-family="system-ui,-apple-system,sans-serif" font-size="20" letter-spacing="-0.3" fill="#14140F"><tspan font-weight="450">Fleet</tspan><tspan font-weight="750">Settle</tspan></text>
  </g>
  <!-- lockups -->
  <g transform="translate(24,412)">
    <g color="#0F2E63" transform="translate(0,11) scale(0.7)"><use href="#c"/></g>
    <text x="150" y="54" font-family="system-ui,-apple-system,sans-serif" font-size="38" letter-spacing="-0.7" fill="#14140F"><tspan font-weight="450">Fleet</tspan><tspan font-weight="750">Settle</tspan></text>
  </g>
  <g transform="translate(500,400)">
