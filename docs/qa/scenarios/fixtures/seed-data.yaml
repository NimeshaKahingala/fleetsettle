  currency: "LKR"
  settings:
    auto_waive_threshold: 0  # W-43: blank means zero
    send_window_start: "08:00"
    send_window_end: "20:00"
    paperwork_warning_days: 30
  first_accounting_period:
    start: "2026-07-01"
    end: "2026-07-31"
    status: "open"

