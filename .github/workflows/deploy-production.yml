name: deploy-production

# DEPLOYMENT.md: merging to `main` deploys production, automatically.
#
# There is no post-merge approval step, because GitHub does not offer one
# here: required reviewers are an environment protection rule, and those are
# unavailable on a private repository on the free plan (the API answers
# `422 — Please ensure the billing plan supports the required reviewers
# protection rule`). So **the human gate is the pull request into `main`** —
# review it as the deploy decision it is, because nothing downstream will
# ask again.
#
# What still stands between a merge and a bad production deploy:
#   1. checks.yml — the same full gate every PR clears
#   2. the guard job — `migrate:check` fails the deploy when a migration is
#      pending, so code can never arrive ahead of its schema
#   3. the smoke suite — asserts the deploy actually works, after the fact
#
# Migrations remain deliberately manual (migrate-production.yml). Applying
# one to live money data is forward-only and stays a separate, explicit act.
#
# `workflow_dispatch` is kept alongside the push trigger so production can
# be re-deployed or rolled forward without inventing a commit.
#
# The `production` environment supplies DATABASE_URL, CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID: environment *secrets* work on every plan; only
# the protection *rules* are gated.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  guard:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fail if a migration is pending
        run: npm run migrate:check -w @fleetsettle/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Deploy web
        run: npm run deploy:production -w @fleetsettle/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy api
        run: npm run deploy:production -w @fleetsettle/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # IG §10.7: /api/docs must 404 in production — this is the CI check
      # that verifies it on every deploy, not just at review time. The 404
      # is passed as the expected status; QA passes 200 to the same script.
      - name: Smoke test
        run: bash .github/scripts/smoke.sh https://fleetsettle.com 404
