name: deploy-production

# DEPLOYMENT.md: push to main promotes to production. Migrations are never
# automatic here — the guard job fails the deploy if any migration is
# pending rather than letting code run ahead of its schema. Applying a
# migration to production is a separate, manually-triggered workflow
# (migrate-production.yml), by design.
#
# Requires the `production` GitHub environment configured with required
# reviewers, and holding DATABASE_URL, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. The reviewer gate is an environment protection
# rule set in GitHub, not something this file can declare.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  guard:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fail if a migration is pending
        run: npm run migrate:check -w @fleetsettle/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Deploy web
        run: npm run deploy:production -w @fleetsettle/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy api
        run: npm run deploy:production -w @fleetsettle/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # IG §10.7: /api/docs must 404 in production — this is the CI check
      # that verifies it on every deploy, not just at review time. The 404
      # is passed as the expected status; QA passes 200 to the same script.
      - name: Smoke test
        run: bash .github/scripts/smoke.sh https://fleetsettle.com 404
