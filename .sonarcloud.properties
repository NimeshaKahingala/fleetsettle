# SonarCloud runs here as Automatic Analysis through the GitHub App — there is
# no CI step and no scanner invocation to pass arguments to, so this file is
# the only place the analysis can be configured.
#
# WHY THE .sql EXCLUSION EXISTS
#
# Sonar has no PostgreSQL analyser. It has PL/SQL (Oracle) and T-SQL, and it
# applies the PL/SQL rules to this project's Postgres migrations, which
# produces advice that is wrong and in one case destructive:
#
#   plsql:CharVarchar  "Use VARCHAR2 instead of CHAR"
#       VARCHAR2 is an Oracle type. It does not exist in PostgreSQL. Taking
#       this advice would make the migration invalid SQL. The flagged column
#       is `currency_code char(3)` — a fixed-width ISO 4217 code, which is
#       precisely what char(3) is for (W-54: one currency, fixed at creation).
#
#   plsql:S1138  "eliminate the use of EXISTS"
#   plsql:OrderByExplicitAscCheck
#       Fired on api/scripts/assert-no-archive-guard-drift.sql, a Postgres
#       catalogue query whose EXISTS clauses are how it detects drift at all.
#
# These were dragging the project's Reliability rating to D on `main` — a
# gate that reports noise stops being read, which is the real cost.
#
# This excludes the files from ANALYSIS ONLY. They remain in the repository,
# under review, and covered by this project's own SQL checks: `npm run guard`
# (scripts/check-forbidden.mjs) and `check:drift`
# (api/scripts/assert-no-trigger-drift.sql), which understand Postgres and are
# what actually enforce the money rules DM §13 cares about.
#
# Deliberately NOT excluded: docs/engineering/fixtures/*.py. Sonar reports a
# BLOCKER there for a hard-coded database credential. That finding is correct
# and must stay visible until the credential is rotated — excluding it would
# hide a real problem rather than a false one.
#
# Reversible: delete this file to restore the previous behaviour.
sonar.exclusions=api/migrations/**/*.sql,api/scripts/**/*.sql
